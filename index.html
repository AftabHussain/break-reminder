<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Break Reminder</title>
  <style>
    :root { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #e9f1fb; background: #111827; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; transition: transform .16s, background .16s, opacity .16s; }
    button:hover { transform: translateY(-2px); }
    button:focus-visible, input:focus-visible { outline: 3px solid #74dfcf; outline-offset: 3px; }
    .control { min-height: 100vh; background: radial-gradient(circle at 0% 0%, #193546, transparent 65%), #111827; padding: 32px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; }
    .brand { color: #b5d6dd; font-size: 15px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #77dbc7; display: inline-block; margin-right: 9px; }
    .eyebrow { color: #8fa6ba; font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; letter-spacing: -.055em; font-weight: 750; font-size: 45px; line-height: 1.1; }
    .muted { color: #9caebf; line-height: 1.6; margin: 0; font-size: 15px; }
    .time { font-size: clamp(65px, 14vw, 82px); letter-spacing: -.07em; text-align: center; font-weight: 750; margin: 45px 0 5px; font-variant-numeric: tabular-nums; }
    .time-caption { text-align: center; color: #95a7b9; font-size: 14px; margin-bottom: 33px; }
    .presets { display: flex; gap: 9px; justify-content: center; margin-bottom: 25px; }
    .preset { border-radius: 12px; background: #223345; color: #c1d0dd; padding: 11px 17px; }
    .preset.active { color: #0d2429; background: #a9eadb; }
    .custom { display: flex; justify-content: center; align-items: center; gap: 10px; color: #9fb6c6; margin: -10px 0 22px; font-size: 14px; }
    .custom input { width: 75px; background: #223345; color: #eaf8f4; border: 1px solid #40566a; padding: 9px; border-radius: 9px; text-align: center; }
    .actions { display: flex; gap: 10px; justify-content: center; }
    .primary { background: #a9eadb; color: #102a2b; font-weight: 700; padding: 15px 23px; border-radius: 14px; }
    .secondary { background: #26364a; color: #e5eef7; padding: 15px 20px; border-radius: 14px; }
    .footer { border-top: 1px solid #2a3849; margin-top: 35px; padding-top: 22px; display: flex; justify-content: space-between; align-items: center; }
    .link { color: #a6c5d1; background: transparent; font-size: 14px; padding: 5px; }
    .error { border: 1px solid #b47c75; color: #ffd6d2; background: #4c2025; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; margin: 14px auto 0; max-width: 570px; }
    .hint { color: #7c90a5; font-size: 12px; text-align: center; margin-top: 18px; }
    .break { display: grid; place-items: center; min-height: 100vh; padding: 38px; text-align: center; overflow: hidden; position: relative;
             background: radial-gradient(ellipse at 50% 5%, #285267 0%, transparent 55%), radial-gradient(ellipse at 50% 110%, #1e4254 0%, transparent 55%), #101c2a; }
    .break::before { content: ''; position: absolute; width: min(68vw, 820px); aspect-ratio: 1; border: 1px solid #68aeba30; border-radius: 50%; transform: translateY(-5%); pointer-events: none; }
    .break::after { content: ''; position: absolute; width: min(52vw, 640px); aspect-ratio: 1; border: 1px solid #68aeba20; border-radius: 50%; transform: translateY(-5%); pointer-events: none; }
    .break-content { position: relative; z-index: 2; animation: appear 1.2s both ease-out; }
    .symbol { display: inline-grid; place-items: center; background: #78d6c52b; color: #a8ebda; border: 1px solid #80d8c64d; border-radius: 50%; width: 94px; height: 94px; font-size: 48px; margin-bottom: 30px; }
    .break h1 { font-size: clamp(72px, 10.6vw, 170px); max-width: 1600px; line-height: 1.05; margin: 0 auto 22px; letter-spacing: -.067em; }
    .break p { color: #bed1df; font-size: clamp(23px, 2.25vw, 33px); line-height: 1.5; margin: 0 auto 52px; }
    .break-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px; }
    .break-buttons button { padding: 22px 38px; font-size: clamp(18px, 1.4vw, 23px); border-radius: 18px; }
    .esc { margin-top: 40px; color: #94a8b8; font-size: 16px; }
    @keyframes appear { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .control { padding: 24px; } .break h1 { font-size: 17vw; } .break-buttons { flex-direction: column; align-items: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div id="root" style="padding: 30px; color: #b6c7d6">Loading React interface… (internet connection required)</div>
  <!-- No npm/build tools: React and JSX compiler are downloaded on first launch. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const fmt = seconds => {
      const total = Math.max(0, Math.ceil(seconds));
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    };

    function App() {
      const [minutes, setMinutes] = useState(25);
      const [state, setState] = useState({ phase: 'idle', remaining: 0, minutes: 25, previewing: false });
      const [error, setError] = useState('');
      const isBreak = state.previewing || state.phase === 'break';

      useEffect(() => {
        let live = true;
        const refresh = async () => {
          try {
            if (window.pywebview?.api && live) setState(await window.pywebview.api.status());
          } catch (err) {
            if (live) setError('Cannot read timer state: ' + String(err));
          }
        };
        refresh();
        const id = setInterval(refresh, 500);
        return () => { live = false; clearInterval(id); };
      }, []);

      const call = async (method, ...args) => {
        setError('');
        try {
          if (!window.pywebview?.api) throw new Error('Desktop bridge unavailable. Open this app with python app.py.');
          const updated = await window.pywebview.api[method](...args);
          setState(updated);
        } catch (err) {
          setError(`${method} failed: ${String(err)}`);
        }
      };

      useEffect(() => {
        if (!isBreak) return;
        const esc = event => { if (event.key === 'Escape') call('finish', 'done'); };
        window.addEventListener('keydown', esc);
        return () => window.removeEventListener('keydown', esc);
      }, [isBreak]);

      const running = state.phase === 'running';
      const paused = state.phase === 'paused';
      return isBreak ? <main className="break"><div className="break-content">
        <div className="symbol">☀</div>
        <h1>Time for<br />a break.</h1>
        <p>Step away. Stretch a little. Give your mind room to breathe.</p>
        <div className="break-buttons">
          {state.previewing && state.phase !== 'break'
            ? <button className="primary" onClick={() => call('finish', 'done')}>Close preview</button>
            : <>
              <button className="primary" onClick={() => call('finish', 'next')}>Start next session</button>
              <button className="secondary" onClick={() => call('finish', 'snooze')}>Snooze 5 minutes</button>
              <button className="secondary" onClick={() => call('finish', 'done')}>Dismiss</button>
            </>}
        </div>
        <div className="esc">Press Esc to dismiss</div>
        {error && <p className="error" role="alert">{error}</p>}
      </div></main> : <main className="control">
        <div className="header"><div className="brand"><span className="dot" />Break Reminder</div><span className="eyebrow">Focus well</span></div>
        <h1>Your time,<br />well spent.</h1>
        <p className="muted">Work with intention. Rest when it's time.</p>
        <div className="time">{state.phase === 'idle' ? fmt(minutes * 60) : fmt(state.remaining)}</div>
        <div className="time-caption">{running ? 'Focus session in progress' : paused ? 'Timer paused' : 'Ready when you are'}</div>
        <div className="presets">{[15, 25, 45, 60].map(n =>
          <button key={n} className={'preset ' + (minutes === n ? 'active' : '')}
            onClick={() => setMinutes(n)} disabled={running || paused}>{n}m</button>)}</div>
        <label className="custom">Custom interval <input type="number" min="1" max="240" value={minutes}
          onChange={e => setMinutes(Number(e.target.value) || 1)} disabled={running || paused} /> minutes</label>
        <div className="actions">
          {running ? <><button className="primary" onClick={() => call('pause')}>Pause</button><button className="secondary" onClick={() => call('reset')}>Reset</button></>
           : paused ? <><button className="primary" onClick={() => call('resume')}>Resume</button><button className="secondary" onClick={() => call('reset')}>Reset</button></>
           : <button className="primary" onClick={() => call('start', minutes)}>Start focus timer →</button>}
        </div>
        <div className="footer"><span className="muted">Full-screen break alert</span><button className="link" onClick={() => call('preview')}>Preview ↗</button></div>
        <div className="hint">You can minimize this window. The timer keeps running.</div>
        {error && <p className="error" role="alert">{error}</p>}
      </main>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
